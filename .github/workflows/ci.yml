name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and aarch64 Linux both, because the sandbox's seccomp filter
        # is written per architecture (phase 3).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        env: [default, stable]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: pixi.lock is written by this version, and a newer pixi
          # rejects it as "lock file not up-to-date with the workspace".
          pixi-version: v0.78.0
          environments: ${{ matrix.env }}

      - name: Unit tests
        run: pixi run -e ${{ matrix.env }} test

      - name: Lint (mojolint --lsp)
        run: pixi run -e ${{ matrix.env }} lint

      - name: Format check
        run: pixi run -e ${{ matrix.env }} format-check
