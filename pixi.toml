[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "process.mojo"
version = "0.1.0"
description = "Run programs from Mojo: spawn, capture, time out, limit, and sandbox them on macOS and Linux."
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tasks]
test = { cmd = "mkdir -p build && mojo build -I src tests/test_process.mojo -o build/process-test && ./build/process-test" }
test-sandbox = { cmd = "mkdir -p build && mojo build -I src tests/test_sandbox.mojo -o build/sandbox-test && ./build/sandbox-test" }
lint = { cmd = "mojolint --lsp -I src src tests" }
fmt = { cmd = "mojo format src tests" }
format-check = { cmd = "mojo format src tests && git diff --exit-code -- src tests" }
check = { depends-on = ["test", "test-sandbox", "lint"] }

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is process-mojo; the Mojo import stays `from process import …`.
[package]
name = "process-mojo"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/process"
name = "process"

[package.host-dependencies]
mojo-compiler = "==1.2.0"

[package.build-dependencies]
mojo-compiler = "==1.2.0"

[package.run-dependencies]
mojo-compiler = ">=1.2.0,<2"

[feature.nightly.dependencies]
modular = ">=26.8.0.dev2026102305,<28"

[feature.stable.dependencies]
mojo-compiler = "==1.2.0"

[environments]
default = ["nightly"]
stable = ["stable"]

[dependencies]
lint-mojo = { git = "https://github.com/magmalake/lint.mojo.git", rev = "4a635f9a0ca0b7b639cd3823534cf0b36ff63985" }
