[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "process.mojo"
version = "0.1.0"
description = "Run programs from Mojo: spawn, capture, time out, limit, and sandbox them on macOS and Linux."
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tasks]
test = { cmd = "mkdir -p build && mojo build -I src tests/test_process.mojo -o build/process-test && ./build/process-test" }
lint = { cmd = "mojolint --lsp -I src src tests" }
# Linux in Docker from a Mac: tests/linux.sh [env] [task], e.g. tests/linux.sh default test
fmt = { cmd = "mojo format src tests examples" }
format-check = { cmd = "mojo format src tests examples && git diff --exit-code -- src tests examples" }
check = { depends-on = ["test", "lint"] }

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is process-mojo; the Mojo import stays `from process import …`.
[package]
name = "process-mojo"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/process"
name = "process"

[package.host-dependencies]
mojo-compiler = "==1.3.0.dev2026112505"

[package.build-dependencies]
mojo-compiler = "==1.3.0.dev2026112505"

[package.run-dependencies]
mojo-compiler = "==1.3.0.dev2026112505"

# examples/dista_build.mojo: process inside a dista task. As in orca, dista
# compiles from a checkout next to this one (it isn't a consumable package
# yet), and its own dependencies are packages pinned at revisions built with
# the same compiler as this workspace: a precompiled Mojo package is refused
# by any other compiler.
[feature.examples.dependencies]
memory-region-mojo = { git = "https://github.com/magmalake/memory-region.mojo", rev = "fa50e3dcb31c01d061463c8bafa48a02bdd9980a" }
arrow-mlake-mojo = { git = "https://github.com/magmalake/arrow-mlake.mojo", rev = "be75dc08cd3e3ab38cca5b1f2e7f6b7fcd5a4377" }
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "8811abff03db45f2bc4616bad833c71392e4ef04" }

[feature.examples.tasks]
example-dista = { cmd = "mkdir -p build && mojo build -I src -I ../dista.mojo/src -I $CONDA_PREFIX/lib/mojo examples/dista_build.mojo -o build/dista-build && ./build/dista-build" }

[environments]
examples = ["examples"]

# One toolchain: the tin, its tests and every consumer use the same Mojo
# nightly. A precompiled Mojo package (.mojoc) loads only in the compiler
# version that built it, so the pin is exact here and in [package] above, and
# it moves across all magmalake tins together. `mojo` rather than
# `mojo-compiler` here: `mojo format` (fmt, format-check) ships in it.
[dependencies]
mojo = "==1.3.0.dev2026112505"
lint-mojo = { git = "https://github.com/magmalake/lint.mojo.git", rev = "b73d03bbfa458417cf9eed56f4e3b7a092d73969" }
